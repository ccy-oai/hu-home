<head>
    <title>Hu Home Test Client</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <style>
        body {
            margin: 0;
            font-family: "Trebuchet MS", sans-serif;
            background: #fef7ea;
            color: #3b2f2f;
        }

        .llama-banner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 24px 16px 16px;
        }

        .llama-banner img {
            width: 160px;
            height: 160px;
            image-rendering: pixelated;
        }

        .llama-banner p {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .client-log {
            padding: 16px;
        }
    </style>
</head>
<body>
    <section class="llama-banner">
        <img src="{{ url_for('static', filename='llama.gif') }}" alt="Blinking llama" />
        <p>Your llama is standing by.</p>
    </section>
    <div class="client-log">Loading...</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/3.0.4/socket.io.js" integrity="sha512-aMGMvNYu8Ue4G+fHa359jcPb1u+ytAF+P2SCb+PxrjCdO3n3ZTxJ30zuH39rimUggmTwmh2u7wvQsDTHESnmfQ==" crossorigin="anonymous"></script>
    <script type="text/javascript" charset="utf-8">
        var sent = 0;
        var clientId = Date.now();
        var ip = "{{ip}}";
        var socket = io('/', {
            transportOptions: {
                polling: {
                    extraHeaders: {
                        'x-client-id': clientId,
                        'x-family-id': "{{familyId}}"
                    }
                }
            }
        });

        sendUpdate = (pos) => {
            let {latitude, longitude, accuracy} = pos.coords;
            sent = (new Date(pos.timestamp)).toISOString();
            console.log({latitude, longitude, accuracy})
            socket.emit('update', {
                clientId,
                ip,
                geo: {latitude, longitude, accuracy}, 
                timestamp: sent
            });
        }

        updateList = (clients) => {
            const log = document.querySelector('.client-log');
            log.innerHTML = "";
            for (const id of Object.keys(clients)) {
                if (!clients[id]) {
                    continue;
                }
                const {geo, timestamp} = clients[id];
                let ip = clients[id];
                div = document.createElement('div');
                div.innerText = `${JSON.stringify({[id]: {ip, geo, time: new Date(timestamp*1000)}})}`;
                log.appendChild(div);
            }
        }

        socket.on('connect', function() {
            setInterval(()=>{
                console.log('Get Location')
                navigator.geolocation.getCurrentPosition(pos => sendUpdate(pos));
            }, 5000)
        });

        socket.on('roster', function(data) {
            console.log(`Get list of everybody: ${JSON.stringify(data)}`)
            updateList(data.members);
        });
        </script>
    </body>
